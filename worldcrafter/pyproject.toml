[project]
name = "worldcrafter"
version = "0.1.0"
description = "Worldcrafter backend for structured world generation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115.8,<1.0.0",
  "httpx>=0.28.1,<1.0.0",
  "pydantic-settings>=2.7.1,<3.0.0",
  "pyyaml>=6.0.2,<7.0.0",
  "uvicorn>=0.34.0,<1.0.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3.5,<9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worldcrafter"]

[tool.pytest.ini_options]
pythonpath = ["src"]
